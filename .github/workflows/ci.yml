name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip ruff aiohttp torch numpy pillow
      - name: Python compile and lint
        run: |
          python -m compileall -q .
          ruff check .
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: JavaScript install
        run: npm ci
      - name: JavaScript tests
        run: npm test
      - name: Rebuild parser bundle
        run: npm run build:mesh
      - name: Verify generated bundle is committed
        run: git diff --exit-code -- js/mesh/parseMeshThree.bundle.js
      - name: Dependency audit
        run: npm audit --audit-level=high
