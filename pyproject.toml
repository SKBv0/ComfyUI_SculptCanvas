[project]
name = "comfyui-sculpt-canvas"
description = "Sculpt 3D meshes directly in the ComfyUI. Ten brushes, OBJ/FBX/GLB/glTF import, OBJ/GLB/STL export and a preview image."
version = "0.1.1"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/SKBv0/ComfyUI_SculptCanvas"
Repository = "https://github.com/SKBv0/ComfyUI_SculptCanvas"
Issues = "https://github.com/SKBv0/ComfyUI_SculptCanvas/issues"

[tool.comfy]
PublisherId = "skb"
DisplayName = "Sculpt Canvas"
Icon = ""

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
